name: rust-build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and check tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Formatting, Clippy, Rust tests, C ABI tests and differential checks
        run: ./scripts/check.sh
      - name: Same-caller release benchmark
        run: ./scripts/bench.sh
      - name: FFI fuzz-harness smoke test
        run: RUNS=10000 ./scripts/fuzz.sh
  minimum-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum supported compiler
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: No-dependency minimum-version tests
        run: cargo +1.85.0 test --workspace --locked --offline
  native-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and both Darwin standard libraries
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Rust, ABI and no-input CoreGraphics tests
        run: ./scripts/test.sh
      - name: Universal app build and signature verification
        run: ARCHS="arm64 x86_64" ./scripts/build.sh
      - name: CLI smoke test (no input posted)
        run: dist/Rheo.app/Contents/MacOS/rheo --help
  miri:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Miri
        run: rustup toolchain install nightly --profile minimal --component miri --component rust-src
      - name: Prepare interpreter
        run: cargo +nightly miri setup
      - name: Interpret portable core and FFI boundary tests
        run: ./scripts/miri.sh
